<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Don Mini App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0f172a;
      color:white;
      padding:20px;
      text-align:center;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    h1{
      margin-bottom:15px;
    }

    .balance{
      font-size:28px;
      margin:15px 0;
      color:#38bdf8;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      margin-top:10px;
      font-size:16px;
      cursor:pointer;
      font-weight:bold;
    }

    .claim{
      background:#22c55e;
      color:white;
    }

    .ads{
      background:#f59e0b;
      color:white;
    }

    .spin{
      background:#a855f7;
      color:white;
    }

    .withdraw{
      background:#ef4444;
      color:white;
    }

    .swap{
      background:#06b6d4;
      color:white;
    }

    .info{
      margin-top:10px;
      font-size:14px;
      color:#cbd5e1;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      margin-top:10px;
      font-size:16px;
    }

    .footer{
      margin-top:20px;
      color:#94a3b8;
      font-size:13px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🪙 Don Mini App</h1>

    <div class="balance" id="balance">
      100 Don
    </div>

    <p>1 Don = $0.0001</p>
  </div>

  <div class="card">
    <h2>🎁 Daily Reward</h2>

    <button class="claim" onclick="claimReward()">
      Claim 10 Don
    </button>

    <div class="info" id="claimInfo">
      Claim once every 24 hours
    </div>
  </div>

  <div class="card">
    <h2>📺 Watch Ads</h2>

    <button class="ads" onclick="watchAds()">
      Watch Ad (+2 Don)
    </button>

    <div class="info">
      Ads Watched Today:
      <span id="adsCount">0</span>/20
    </div>
  </div>

  <div class="card">
    <h2>🎰 Spin & Win</h2>

    <button class="spin" onclick="spinWheel()">
      Spin
    </button>

    <div class="info" id="spinResult">
      Try your luck
    </div>
  </div>

  <div class="card">
    <h2>👥 Referral</h2>

    <p>Your Referral Reward: 20 Don</p>

    <input
      type="text"
      value="https://t.me/YourBot?start=12345"
      readonly
    />
  </div>

  <div class="card">
    <h2>🔄 Swap Don → USDT</h2>

    <button class="swap" onclick="swapCoins()">
      Swap Coins
    </button>

    <div class="info">
      Minimum Swap: 10000 Don
    </div>
  </div>

  <div class="card">
    <h2>💸 Withdraw</h2>

    <input
      type="text"
      placeholder="Enter USDT Wallet Address"
      id="wallet"
    />

    <button class="withdraw" onclick="withdraw()">
      Withdraw
    </button>

    <div class="info">
      Minimum Withdraw: 10000 Don
    </div>
  </div>

  <div class="footer">
    Don Mini App © 2026
  </div>

  <script>
    let balance = 100;
    let adsWatched = 0;

    function updateBalance(){
      document.getElementById("balance").innerText =
        balance + " Don";
    }

    // DAILY CLAIM
    function claimReward(){

      let lastClaim =
        localStorage.getItem("lastClaim");

      let now = Date.now();

      if(lastClaim && now - lastClaim < 86400000){

        let hours =
          Math.floor(
            (86400000 - (now - lastClaim))
            / 3600000
          );

        document.getElementById("claimInfo")
          .innerText =
          "Come back in " + hours + " hours";

        return;
      }

      balance += 10;

      localStorage.setItem("lastClaim", now);

      updateBalance();

      alert("You claimed 10 Don");
    }

    // WATCH ADS
    function watchAds(){

      if(adsWatched >= 20){
        alert("Daily Ads Limit Reached");
        return;
      }

      adsWatched++;

      balance += 2;

      document.getElementById("adsCount")
        .innerText = adsWatched;

      updateBalance();

      alert("You earned 2 Don");
    }

    // SPIN
    function spinWheel(){

      let rewards = [
        0,1,2,3,5,10,20,50
      ];

      let reward =
        rewards[
          Math.floor(
            Math.random() * rewards.length
          )
        ];

      balance += reward;

      updateBalance();

      document.getElementById("spinResult")
        .innerText =
        "You won " + reward + " Don";
    }

    // SWAP
    function swapCoins(){

      if(balance < 10000){
        alert("Minimum Swap is 10000 Don");
        return;
      }

      let usdt = balance * 0.0001;

      alert(
        "Swapped to $" + usdt.toFixed(2)
        + " USDT"
      );
    }

    // WITHDRAW
    function withdraw(){

      let wallet =
        document.getElementById("wallet").value;

      if(wallet === ""){
        alert("Enter wallet address");
        return;
      }

      if(balance < 10000){
        alert("Minimum Withdraw is 10000 Don");
        return;
      }

      let usdt = balance * 0.0001;

      alert(
        "Withdraw Request Sent: $" +
        usdt.toFixed(2)
      );
    }

    updateBalance();
  </script>

</body>
</html>
